[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xRLAgents"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "torch",
  "envpool"
]

[tool.setuptools.packages.find]
where = ["xRLAgents"]
include = ["*"]